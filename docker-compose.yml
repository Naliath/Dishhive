# =============================================================================
# Dishhive - Docker Compose
# =============================================================================
# Usage:
#   docker-compose up -d          # Start all services
#   docker-compose down           # Stop all services
#   docker-compose down -v        # Stop and remove volumes (data)
#   docker-compose logs -f        # View logs
#   docker-compose up -d --build  # Rebuild and start
#
# Ports are deliberately offset from Freezy (app 5000, db 5432) so both
# applications can run side by side: Dishhive uses app 5100, db 5433.
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  db:
    image: postgres:16-alpine
    container_name: dishhive-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: dishhive
      POSTGRES_USER: dishhive
      POSTGRES_PASSWORD: dishhive_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dishhive -d dishhive"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # .NET 10 App (API + Angular Frontend)
  # ===========================================================================
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    container_name: dishhive-app
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5100
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=dishhive;Username=dishhive;Password=dishhive_dev_password"
      # Optional Freezy integration; set to e.g. http://host.docker.internal:5000
      Freezy__BaseUrl: "http://host.docker.internal:5000"
      # Demo mode: seeds an empty database with 20 Dagelijkse Kost recipes and a
      # demo household (the Rocinante crew). Set to "false" for real use.
      Demo__Enabled: "true"
      # Optional AI week-plan suggestions (disabled while Ai__Provider is empty).
      # Per-developer config + the API key live in a gitignored .env (copy .env.example);
      # the committed defaults below target a local LM Studio.
      # Providers: openai | anthropic | mistral | ollama | lmstudio | openai-compatible
      Ai__Provider: "${AI_PROVIDER:-lmstudio}"
      Ai__ApiKey: "${AI_API_KEY:-}"
      Ai__BaseUrl: "${AI_BASE_URL:-http://host.docker.internal:1234/v1}"
      Ai__Model: "${AI_MODEL:-qwen/qwen3.6-35b-a3b}"
      # Optional robustness/context tuning (built-in defaults shown)
      Ai__Temperature: "${AI_TEMPERATURE:-0.3}"
      Ai__MaxRetries: "${AI_MAX_RETRIES:-1}"
      Ai__MaxPromptTokens: "${AI_MAX_PROMPT_TOKENS:-6000}"
      # Recipe-scrapers sidecar: fallback import provider for sites without a
      # dedicated C# provider. Leave empty to disable the fallback.
      RecipeScrapers__BaseUrl: "http://scraper:8000"
    ports:
      - "5100:5100"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================================================
  # Recipe-Scraper Sidecar (Python recipe-scrapers fallback import provider)
  # ===========================================================================
  # The app stays fully functional when this service is down — only fallback
  # imports (sites without a dedicated provider) become unavailable.
  # Package updates installed via the settings UI land in the scraper_lib
  # volume and survive container restarts and recreation.
  scraper:
    build:
      context: .
      dockerfile: docker/scraper.Dockerfile
    container_name: dishhive-scraper
    restart: unless-stopped
    ports:
      # Host access for local development (dotnet run with
      # RecipeScrapers__BaseUrl=http://localhost:5101); the app container
      # reaches it internally at http://scraper:8000
      - "5101:8000"
    volumes:
      - scraper_lib:/data/lib
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  scraper_lib:
    driver: local
