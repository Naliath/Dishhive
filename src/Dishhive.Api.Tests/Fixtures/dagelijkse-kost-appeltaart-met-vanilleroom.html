it van onze dienstverlening te monitoren en te verbeteren.\"],\"text\":\"Voor uw privacy gelden de volgende regels bij gebruik van de \u003cstrong\u003eAI Sous-chef\u003c/strong\u003e, ter aanvulling van het algemeen VRT-privacybeleid:\",\"title\":\"Privacy en gegevensverwerking\"},\"prohibitedUses\":{\"points\":[\"De \u003cstrong\u003eAI Sous-chef\u003c/strong\u003e te gebruiken voor onwettige of schadelijke doeleinden.\",\"De \u003cstrong\u003eAI Sous-chef\u003c/strong\u003e, of de gebruikte modellen, te manipuleren, te 'jailbreaken' of outputbeveiligingen te omzeilen.\",\"Inhoud in te voeren die beledigend is of in strijd met de wet.\",\"Persoonsgegevens van derden in te voeren zonder hun uitdrukkelijke toestemming.\"],\"text\":\"Het is niet toegestaan om:\",\"title\":\"Verboden gebruik\"},\"technologyNature\":{\"text\":\"De \u003cstrong\u003eAI Sous-chef-functie\u003c/strong\u003e maakt gebruik van geavanceerde AI-technologie (Large Language Models) om culinaire vragen over recepten in de App te beantwoorden. Antwoorden worden in real-time gegenereerd op basis van uw invoer. Omdat de technologie generatief is, kunnen antwoorden per sessie variëren. De \u003cstrong\u003eAI Sous-chef\u003c/strong\u003e heeft geen toegang tot actuele externe informatie; de parate kennis kan daarom beperkt of verouderd zijn.\",\"title\":\"Werking van de technologie\"},\"title\":\"AI Sous-chef-beleid\"},\"appBar\":{\"articles\":\"Kookmagazine\",\"favorites\":\"Receptenboekje\",\"howTos\":\"Kookvragen\",\"userMenu\":{\"myFavorites\":{\"description\":\"Beheer je favoriete recepten en collecties\",\"title\":\"Mijn receptenboekje\"},\"title\":\"Mijn VRT-profiel\"}},\"appName\":\"Dagelijkse kost\",\"appOnly\":{\"description\":\"Sommige fucties zijn exclusief beschikbaar in onze app. Zo kunnen we je de beste kookervaring bieden, inclusief je eigen weekmenu, boodschappenlijstje en nog veel meer.\",\"imageAlt\":\"Screenshot van de Dagelijkse kost app\",\"moreArticlesTitle\":\"Meer over de ap
